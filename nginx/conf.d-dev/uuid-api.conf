server {
    listen 8080;
    server_name uuid-api.dev.hubmapconsortium.org;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 4430 ssl;
    server_name uuid-api.dev.hubmapconsortium.org;
    root /usr/share/nginx/html;

    ssl_certificate /etc/letsencrypt/live/gateway.dev.hubmapconsortium.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gateway.dev.hubmapconsortium.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /usr/src/app/log/nginx_access_uuid-api.log;
    error_log /usr/src/app/log/nginx_error_uuid-api.log warn;

    location = /favicon.ico {
        alias /usr/share/nginx/html/favicon.ico;
    }

    location = /api_auth {
        internal;
        proxy_pass http://hubmap-auth-server/api_auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host "uuid-api";
        proxy_set_header X-Original-Request-Method $request_method;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Cache-Control, Content-Type' always;
            add_header 'Access-Control-Max-Age' 86400 always;
            return 204;
        }

        if ($request_method ~ (POST|GET|PUT|DELETE)) {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Cache-Control, Content-Type' always;
        }

        auth_request /api_auth;

        include uwsgi_params;
        uwsgi_pass uwsgi://uuid-api:5000;
        uwsgi_param HTTP_X_FORWARDED_PROTO $scheme;
        uwsgi_param UWSGI_SCHEME $scheme;
        uwsgi_read_timeout 300s;
        uwsgi_send_timeout 300s;
    }
}